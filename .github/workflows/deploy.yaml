name: Deploy to Nekoweb

on:
  push:
    branches:
      - "main"
    paths:
      - "src/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: deploy2nekoweb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: deploy2nekoweb
        uses: indiefellas/deploy2nekoweb@main
        with:
          nekoweb-api-key: ${{ secrets.NEKOWEB_API_KEY }}
          nekoweb-domain: "vim.fish"
          nekoweb-username: "vim"
          directory: "src"
